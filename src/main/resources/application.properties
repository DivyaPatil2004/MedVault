spring.application.name=MedVault

spring.datasource.url=jdbc:postgresql://localhost:5432/medvault
spring.datasource.username=medvault_user
spring.datasource.password=medvault_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:ThisIsADevelopmentOnlySecretKeyWithAtLeast32Bytes!}

medvault.admin.email=admin@medvault.com
medvault.admin.password=Admin@123

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs